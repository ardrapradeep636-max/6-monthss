<!DOCTYPE html>
<html>
<head>
    <title>Happy 6 Months ❤️</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: white;
            height: 100vh;
        }

        h1 {
            margin-top: 100px;
            font-size: 40px;
            animation: glow 2s infinite alternate;
        }

        p {
            font-size: 20px;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            background-color: white;
            color: #ff4e88;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ffe6f0;
            transform: scale(1.1);
        }

        #surprise {
            display: none;
            margin-top: 30px;
            font-size: 22px;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px white; }
            to { text-shadow: 0 0 20px #ff4e88; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>

    <h1>Happy 6 Months Together 💕</h1>
    <p>6 months of memories, laughter and love 💖</p>

    <button onclick="showSurprise()">Click for Surprise 🎁</button>

    <div id="surprise">
        💌 You are the most special person in my life.  
        Thank you for these beautiful 6 months 💕✨
    </div>

    <script>
        function showSurprise() {
            document.getElementById("surprise").style.display = "block";
        }
    </script>

</body>
</html>
